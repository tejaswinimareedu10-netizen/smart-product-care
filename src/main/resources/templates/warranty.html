<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Warranty Details - Smart Product Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <div>
            <a href="/products" class="btn btn-outline-light btn-sm">Products</a>
            <a href="/dashboard" class="btn btn-primary btn-sm">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Warranty Details</h2>
            <h5 class="text-muted">Product: <span th:text="${product.productName}" class="text-dark fw-bold">AC</span></h5>
        </div>
        <a th:href="@{'/warranty/add/' + ${product.productId}}" class="btn btn-success">
            + Add Warranty
        </a>
    </div>

    <!-- Warranty Table Card -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-striped align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Provider</th>
                        <th>Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="warranty : ${warranties}">
                        <td th:text="${warranty.startDate}">2026-01-01</td>
                        <td th:text="${warranty.endDate}">2027-01-01</td>
                        <td th:text="${warranty.warrantyProvider}">Provider Name</td>
                        <td>
                            <span class="badge bg-success" th:text="${warranty.status}">Active</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/warranty/delete/' + ${warranty.warrantyId}}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this warranty record?');">
                                Delete
                            </a>
                        </td>
                    </tr>
                    <!-- Empty Fallback Row -->
                    <tr th:if="${warranties.empty}">
                        <td colspan="5" class="text-center text-muted py-4">
                            No warranty details found for this product.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Back Button -->
    <div class="mt-4">
        <a href="/products" class="btn btn-secondary">
            &larr; Back to Products
        </a>
    </div>

</div>

</body>
</html>
