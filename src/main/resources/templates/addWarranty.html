<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Warranty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <a href="/products" class="btn btn-primary">Products</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h2 class="mb-4">Add Warranty Record</h2>

            <form th:action="@{/save-warranty}" method="post">

                <!-- Pass Product ID directly -->
                <input type="hidden" name="product.productId" th:value="${product.productId}">

                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="startDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="endDate" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Provider</label>
                    <input type="text" name="warrantyProvider" class="form-control" placeholder="e.g. Brand Warranty" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-control" required>
                        <option value="Active">Active</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success">Save Warranty</button>
                    <a th:href="@{'/warranty/' + ${product.productId}}" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
