<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Product - Smart Product Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <a href="/products" class="btn btn-primary">Products</a>
    </div>
</nav>

<div class="container mt-5">

    <h2>Edit Product</h2>

    <form th:action="@{/products/update/{id}(id=${product.productId})}"
          th:object="${product}"
          method="post">

        <div class="mb-3">
            <label>Product Name</label>
            <input type="text"
                   th:field="*{productName}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Brand</label>
            <input type="text"
                   th:field="*{brand}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input type="text"
                   th:field="*{category}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Purchase Date</label>
            <input type="date"
                   th:field="*{purchaseDate}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Warranty Months</label>
            <input type="number"
                   th:field="*{warrantyMonths}"
                   class="form-control"
                   placeholder="Example: 24"
                   required>
        </div>

        <button type="submit" class="btn btn-success">
            Update Product
        </button>

        <a href="/products" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
