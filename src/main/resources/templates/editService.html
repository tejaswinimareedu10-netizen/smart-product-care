<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            Smart Product Care
        </a>

        <a href="/services" class="btn btn-primary">
            Service History
        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2>Edit Service Record</h2>

    <form th:action="@{/updateService}"
          th:object="${serviceHistory}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <input type="hidden"
               th:field="*{productId}">

        <div class="mb-3">

            <label>Service Date</label>

            <input type="date"
                   th:field="*{serviceDate}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Service Center</label>

            <input type="text"
                   th:field="*{serviceCenter}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Description</label>

            <textarea th:field="*{description}"
                      class="form-control"
                      rows="4"
                      required></textarea>

        </div>

        <div class="mb-3">

            <label>Cost</label>

            <input type="number"
                   step="0.01"
                   th:field="*{cost}"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-success">

            Update Service

        </button>

        <a href="/services"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>
</html>
