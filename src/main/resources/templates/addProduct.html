<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Product - Smart Product Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <a href="/products" class="btn btn-primary btn-sm">Products</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h2 class="mb-4">Add / Edit Product</h2>

            <!-- Form action matching controller mapping -->
            <form th:action="@{/products/add}" th:object="${product}" method="post" enctype="multipart/form-data">

                <!-- Hidden ID field for handling Edit updates properly -->
                <input type="hidden" th:field="*{productId}"/>

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text"
                           th:field="*{productName}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Brand</label>
                    <input type="text"
                           th:field="*{brand}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text"
                           th:field="*{category}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Purchase Date</label>
                    <input type="date"
                           th:field="*{purchaseDate}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Warranty Months</label>
                    <input type="number"
                           th:field="*{warrantyMonths}"
                           class="form-control"
                           placeholder="Example: 24"
                           required>
                </div>

                <!-- Bill / Receipt Upload Field -->
                <div class="mb-3">
                    <label class="form-label">Upload Bill / Receipt (PDF or Image)</label>
                    <input type="file" name="file" class="form-control" accept=".pdf,image/*">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-success">Save Product</button>
                    <a href="/products" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
