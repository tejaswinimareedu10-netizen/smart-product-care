<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Smart Product Care - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            Smart Product Care
        </a>

        <div>

            <a href="/products" class="btn btn-primary">
                Products
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="mb-4">
        Dashboard
    </h2>


    <div class="row">

        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Total Products</h5>

                    <h2 th:text="${totalProducts}">
                        0
                    </h2>

                    <a href="/products"
                       class="btn btn-primary">
                        View Products
                    </a>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Add Product</h5>

                    <p>Register a new electronic product.</p>

                    <!-- Fixed link: changed /addProduct to /products/add -->
                    <a href="/products/add"
                       class="btn btn-success">
                        Add Product
                    </a>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Product Care</h5>

                    <p>Manage warranty and service records.</p>

                    <a href="/products"
                       class="btn btn-info">
                        Manage
                    </a>

                </div>

            </div>

        </div>

    </div>


    <h3 class="mt-5 mb-3">
        My Products
    </h3>


    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Brand</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="product : ${products}">

            <td th:text="${product.productId}"></td>

            <td th:text="${product.productName}"></td>

            <td th:text="${product.brand}"></td>

            <td>

                <a th:href="@{'/service-history/' + ${product.productId}}"
                   class="btn btn-info btn-sm">
                    Service
                </a>

                <a th:href="@{'/warranty/' + ${product.productId}}"
                   class="btn btn-warning btn-sm">
                    Warranty
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
