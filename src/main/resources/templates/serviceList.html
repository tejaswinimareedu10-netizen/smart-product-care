<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Service History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            Smart Product Care
        </a>

        <div>

            <a href="/products"
               class="btn btn-primary">

                Products

            </a>

            <a href="/dashboard"
               class="btn btn-secondary">

                Dashboard

            </a>

            <a href="/logout"
               class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        Service History
    </h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Product ID</th>
            <th>Service Date</th>
            <th>Service Center</th>
            <th>Description</th>
            <th>Cost</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="service : ${services}">

            <td th:text="${service.id}"></td>

            <td th:text="${service.productId}"></td>

            <td th:text="${service.serviceDate}"></td>

            <td th:text="${service.serviceCenter}"></td>

            <td th:text="${service.description}"></td>

            <td th:text="${service.cost}"></td>

            <td>

                <a th:href="@{/editService/{id}(id=${service.id})}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a th:href="@{/deleteService/{id}(id=${service.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this service record?')">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
