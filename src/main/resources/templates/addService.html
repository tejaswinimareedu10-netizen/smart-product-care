<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Service - Smart Product Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <a href="/products" class="btn btn-primary">Products</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="mb-4">Add Service History</h2>

            <form th:action="@{/save-service}"
                  th:object="${serviceHistory}"
                  method="post">

                <input type="hidden"
                       th:field="*{product.productId}">

                <div class="mb-3">
                    <label class="form-label">Service Date</label>
                    <input type="date"
                           th:field="*{serviceDate}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Service Center</label>
                    <input type="text"
                           th:field="*{serviceCenter}"
                           class="form-control"
                           placeholder="e.g. Sonovision"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="3"
                              placeholder="Enter repair or service details"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cost</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{cost}"
                           class="form-control"
                           placeholder="0.00"
                           required>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success">Save Service</button>
                    <a th:href="@{'/service-history/' + ${product.productId}}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
