<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Product List - Smart Product Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <div>
            <a href="/products/add" class="btn btn-success btn-sm">Add Product</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Product List</h2>
        <a href="/products/add" class="btn btn-success">+ Add New Product</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-striped align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Purchase Date</th>
                    <th>Warranty Expiry</th>
                    <th>Status</th>
                    <th>Receipt</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Safe iteration over products list -->
                <tr th:each="product : ${products}">
                    <td th:text="${product.productId}">1</td>
                    <td th:text="${product.productName}">Name</td>
                    <td th:text="${product.brand}">Brand</td>
                    <td th:text="${product.category}">Category</td>
                    <td th:text="${product.purchaseDate}">Date</td>
                    <td th:text="${product.warrantyExpiry}">Expiry</td>
                    <td>
                        <span class="badge bg-success" th:text="${product.warrantyStatus != null ? product.warrantyStatus : 'Active'}">Active</span>
                    </td>
                    <!-- View Bill / Receipt Button -->
                    <td>
                        <a th:if="${product.receiptPath != null and !product.receiptPath.isEmpty()}" 
                           th:href="@{'/uploads/' + ${product.receiptPath}}" 
                           target="_blank" 
                           class="btn btn-info btn-sm text-white">
                            View Bill
                        </a>
                        <span th:if="${product.receiptPath == null or product.receiptPath.isEmpty()}" class="text-muted small">No Bill</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/products/edit/{id}(id=${product.productId})}" class="btn btn-primary btn-sm">Edit</a>
                        <a th:href="@{/products/delete/{id}(id=${product.productId})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this product?');">Delete</a>
                    </td>
                </tr>
                <!-- Fallback row if list is empty -->
                <tr th:if="${products == null or products.empty}">
                    <td colspan="9" class="text-center text-muted py-4">No products found. Add your first product!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
