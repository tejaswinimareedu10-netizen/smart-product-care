<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Service History - Smart Product Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Smart Product Care</a>
        <div>
            <a href="/products" class="btn btn-outline-light btn-sm">Products</a>
            <a href="/dashboard" class="btn btn-primary btn-sm">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Service History</h2>
            <h5 class="text-muted">Product: <span th:text="${product.productName}" class="text-dark fw-bold">Name</span></h5>
        </div>
        <!-- Fixed URL to match @GetMapping("/add-service/{productId}") -->
        <a th:href="@{'/add-service/' + ${product.productId}}" class="btn btn-success">
            + Add Service Record
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-striped align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Service Center</th>
                    <th>Description</th>
                    <th>Cost</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="service : ${services}">
                    <td th:text="${service.serviceDate}">Date</td>
                    <td th:text="${service.serviceCenter}">Center</td>
                    <td th:text="${service.description}">Description</td>
                    <td th:text="'₹ ' + ${service.cost}">Cost</td>
                    <td class="text-center">
                        <a th:href="@{'/delete-service/' + ${service.serviceId}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this service record?');">
                            Delete
                        </a>
                    </td>
                </tr>
                <tr th:if="${services == null || services.empty}">
                    <td colspan="5" class="text-center text-muted py-4">
                        No service history found for this product.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a href="/products" class="btn btn-secondary">
            &larr; Back to Products
        </a>
    </div>

</div>

</body>
</html>
